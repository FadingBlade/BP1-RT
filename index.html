<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BP1 Loader</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1117;color:#e6edf3;font-family:Arial,sans-serif}#loader{width:min(720px,92%);padding:30px;background:#161b22;border:1px solid #30363d;border-radius:14px}h1{margin-top:0}.description,.small{color:#8b949e;line-height:1.5}.small{font-size:12px;margin-top:10px}label{display:block;margin:18px 0 7px;color:#8b949e;font-size:14px}input{width:100%;padding:12px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#fff;font-size:15px}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#238636;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}#status{margin-top:16px;padding:12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;white-space:pre-wrap;line-height:1.45}#website{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:white}</style></head>
<body><div id="loader"><h1>BP1 Loader</h1><p class="description">Load an encrypted BP1 website from a public GitHub repository.</p>
<label for="repository">GitHub Repository</label><input id="repository" placeholder="https://github.com/user/repository" autocomplete="off">
<label for="key">BP1 Key</label><input id="key" type="password" placeholder="Encryption key" autocomplete="off">
<button id="loadButton">Load Website</button><div id="status">Ready.</div><div class="small">BP1 Runtime · build 1.0.0</div></div>
<iframe id="website" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads" referrerpolicy="no-referrer"></iframe>
<script>
"use strict";
const MAGIC="BP1E",V1=1,V2=2,ITER=250000,RUNTIME_VERSION="1.0.0",CACHE_PREFIX="bp1-package-",LEGACY_CACHE_PREFIX="bp1-package-v1-",CONCURRENCY=6;
const PACKAGE_ID_RE=/^[a-f0-9]{32}$/i,SHA256_RE=/^[a-f0-9]{64}$/i,enc=new TextEncoder(),dec=new TextDecoder("utf-8",{fatal:true}),$=id=>document.getElementById(id);
function parseRepository(url){const m=url.trim().replace(/\/+$/,'').match(/^https?:\/\/github\.com\/([^/]+)\/([^/#?]+)/i);if(!m)throw new Error("Invalid GitHub repository URL.");return{owner:m[1],repo:m[2].replace(/\.git$/i,'')}}
async function getRepositoryFiles(repository){const{owner,repo}=parseRepository(repository),u=`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/trees/HEAD?recursive=1`,r=await fetch(u,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});if(!r.ok){if(r.status===404)throw new Error("GitHub repository not found or not public.");throw new Error(`GitHub repository request failed (${r.status}).`)}const d=await r.json();if(d.truncated)throw new Error("GitHub returned a truncated repository tree.");return d.tree||[]}
function rawURL(repository,path){const{owner,repo}=parseRepository(repository);return `https://raw.githubusercontent.com/${owner}/${repo}/HEAD/${path.split('/').map(encodeURIComponent).join('/')}`}
function hex(bytes){return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}
function equalBytes(a,b){if(a.length!==b.length)return false;let x=0;for(let i=0;i<a.length;i++)x|=a[i]^b[i];return x===0}
function parseHeader(data){if(!(data instanceof Uint8Array)||data.length<49)throw new Error("Invalid BP1 file structure.");if(dec.decode(data.slice(0,4))!==MAGIC)throw new Error("Invalid BP1 file magic.");const version=data[4];if(version!==V1&&version!==V2)throw new Error(`Unsupported BP1 file version: ${version}.`);return{version,salt:data.slice(5,21),iv:data.slice(21,33),ciphertext:data.slice(33)}}
async function importPassword(password){return crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey","deriveBits"])}
async function deriveV1Key(passwordKey,salt,usage){return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},passwordKey,{name:"AES-GCM",length:256},false,[usage])}
async function deriveMaster(passwordKey,salt){const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},passwordKey,256);return crypto.subtle.importKey("raw",bits,"HKDF",false,["deriveKey"])}
async function deriveV2FileKey(master,salt,context,usage){return crypto.subtle.deriveKey({name:"HKDF",hash:"SHA-256",salt,info:enc.encode(`BP1v2:${context}`)},master,{name:"AES-GCM",length:256},false,[usage])}
async function decryptV1(data,passwordKey){const h=parseHeader(data);if(h.version!==V1)throw new Error("Not a legacy BP1 object.");const key=await deriveV1Key(passwordKey,h.salt,"decrypt");try{return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:h.iv},key,h.ciphertext))}catch{throw new Error("Invalid BP1 key or corrupted package.")}}
async function decryptV2(data,master,packageSalt,context){const h=parseHeader(data);if(h.version!==V2)throw new Error("Current BP1 package contains an incompatible object.");if(!equalBytes(h.salt,packageSalt))throw new Error(`BP1 package-salt mismatch for ${context}.`);const key=await deriveV2FileKey(master,packageSalt,context,"decrypt");try{return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:h.iv,additionalData:enc.encode(`BP1|2|${context}`)},key,h.ciphertext))}catch{throw new Error(`Invalid BP1 key or corrupted BP1 object: ${context}.`)}}
function normalizePath(input){if(typeof input!=="string"||!input||input.length>2048||/[\u0000-\u001F\u007F]/.test(input)||input.includes('\\')||input.startsWith('/')||input.endsWith('/'))throw new Error(`Invalid BP1 path: ${input}`);const p=input.split('/');if(p.some(x=>!x||x==='.'||x==='..'))throw new Error(`Invalid BP1 path: ${input}`);return p.join('/')}
function validateMime(type,path){if(type==null||type==='')return'application/octet-stream';if(typeof type!=="string"||type.length>255||/[\r\n\u0000]/.test(type))throw new Error(`Invalid MIME type for ${path}.`);return type}
function validateManifest(m,wireVersion,packageSalt){if(!m||typeof m!=="object"||Array.isArray(m))throw new Error("Invalid BP1 manifest.");if(m.bp1!==wireVersion)throw new Error(`Manifest/file version mismatch (${m.bp1} vs ${wireVersion}).`);if(m.algorithm&&m.algorithm!=="AES-256-GCM")throw new Error(`Unsupported algorithm: ${m.algorithm}.`);if(wireVersion===V1){if(m.kdf&&m.kdf!=="PBKDF2-SHA-256")throw new Error(`Unsupported v1 KDF: ${m.kdf}.`)}else{if(m.kdf!=="PBKDF2-SHA-256+HKDF-SHA-256")throw new Error(`Unsupported v2 KDF: ${m.kdf}.`);if(m.masterSalt&&m.masterSalt.toLowerCase()!==hex(packageSalt))throw new Error("Manifest master salt does not match index.bp1 header.");if(m.hkdfHash&&m.hkdfHash!=="SHA-256")throw new Error(`Unsupported HKDF hash: ${m.hkdfHash}.`)}if(m.iterations!=null&&m.iterations!==ITER)throw new Error(`Unsupported PBKDF2 iteration count: ${m.iterations}.`);if(typeof m.entry!=="string"||!m.files||typeof m.files!=="object"||Array.isArray(m.files))throw new Error("Invalid manifest structure.");const files=new Map(),objects=new Set();for(const[raw,info]of Object.entries(m.files)){const path=normalizePath(raw);if(path!==raw||files.has(path))throw new Error(`Invalid or duplicate path: ${raw}`);if(!info||typeof info!=="object")throw new Error(`Invalid file entry: ${path}`);const object=info.object;if(typeof object!=="string"||!object||object.length>255||object.includes('/')||object.includes('\\')||/[\u0000-\u001F\u007F]/.test(object)||objects.has(object))throw new Error(`Invalid or duplicate object for ${path}.`);objects.add(object);if(!SHA256_RE.test(String(info.sha256||'')))throw new Error(`Missing/invalid SHA-256 for ${path}.`);if(info.size!=null&&(!Number.isSafeInteger(info.size)||info.size<0))throw new Error(`Invalid size for ${path}.`);files.set(path,{object,type:validateMime(info.type,path),size:info.size,sha256:info.sha256.toLowerCase()})}const entry=normalizePath(m.entry);if(!files.has(entry))throw new Error("Entry file does not exist.");return{...m,entry,files}}
async function verify(path,data,info){if(info.size!=null&&data.byteLength!==info.size)throw new Error(`Size verification failed for ${path}.`);const actual=hex(new Uint8Array(await crypto.subtle.digest("SHA-256",data)));if(actual!==info.sha256)throw new Error(`SHA-256 verification failed for ${path}.`)}
function encodePath(path){return path.split('/').map(encodeURIComponent).join('/')}
async function registerRuntime(){if(!('serviceWorker'in navigator))throw new Error("Service Workers are unsupported.");if(!isSecureContext)throw new Error("HTTPS is required.");const reg=await navigator.serviceWorker.register(new URL(`bp1-sw.js?v=${RUNTIME_VERSION}`,document.baseURI),{scope:new URL('./',document.baseURI).pathname,updateViaCache:'none'});try{await reg.update()}catch{}if(reg.waiting)reg.waiting.postMessage({type:'BP1_SKIP_WAITING'});await navigator.serviceWorker.ready;if(!navigator.serviceWorker.controller){await new Promise(resolve=>{const t=setTimeout(resolve,2500);navigator.serviceWorker.addEventListener('controllerchange',()=>{clearTimeout(t);resolve()},{once:true})})}}
async function deleteOldCaches(keep){const keys=await caches.keys();await Promise.all(keys.filter(k=>(k.startsWith(CACHE_PREFIX)||k.startsWith(LEGACY_CACHE_PREFIX))&&k!==keep).map(k=>caches.delete(k)))}
function packageId(){return crypto.randomUUID?crypto.randomUUID().replaceAll('-',''):hex(crypto.getRandomValues(new Uint8Array(16)))}
async function putPackage(id,repository,manifest,decrypted,wireVersion){const name=CACHE_PREFIX+id;await caches.delete(name);const cache=await caches.open(name),base=new URL(`__bp1__/${id}/`,document.baseURI);try{for(const[path,file]of decrypted){const headers=new Headers({"Content-Type":file.type,"Content-Length":String(file.data.byteLength),"Accept-Ranges":"bytes","Cache-Control":"no-store","X-Content-Type-Options":"nosniff","X-BP1-Package":id,"X-BP1-Profile":String(wireVersion),"X-BP1-Integrity":"sha256-verified"});await cache.put(new URL(encodePath(path),base),new Response(file.data,{status:200,headers}))}}catch(e){await caches.delete(name);throw e}return{cacheName:name,id,repository,name:manifest.name||"BP1 Website",entry:manifest.entry}}
async function downloadObject(repository,object){const r=await fetch(rawURL(repository,"bp/"+object),{cache:"no-store"});if(!r.ok)throw new Error(`Missing BP1 resource: ${object} (${r.status}).`);return new Uint8Array(await r.arrayBuffer())}
async function parallelMap(entries,limit,fn){let next=0;const out=new Array(entries.length);async function worker(){while(true){const i=next++;if(i>=entries.length)return;out[i]=await fn(entries[i],i)}}await Promise.all(Array.from({length:Math.min(limit,entries.length)},worker));return out}
async function loadBP1(){const repository=$('repository').value.trim(),password=$('key').value,status=$('status'),button=$('loadButton');if(!repository){status.textContent='Enter a GitHub repository.';return}if(!password){status.textContent='Enter the BP1 key.';return}button.disabled=true;let newCache=null;const started=performance.now();try{parseRepository(repository);status.textContent='Preparing runtime...';await registerRuntime();status.textContent='Searching repository...';const tree=await getRepositoryFiles(repository),matches=tree.filter(f=>f.type==='blob'&&f.path==='index.bp1');if(matches.length!==1)throw new Error(matches.length?'Ambiguous index.bp1.':'Repository does not contain index.bp1.');status.textContent='Downloading index.bp1...';const ir=await fetch(rawURL(repository,'index.bp1'),{cache:'no-store'});if(!ir.ok)throw new Error(`Could not download index.bp1 (${ir.status}).`);const encryptedIndex=new Uint8Array(await ir.arrayBuffer()),header=parseHeader(encryptedIndex),passwordKey=await importPassword(password);let indexPlain,master=null,kdfMs=0;if(header.version===V1){status.textContent='Decrypting legacy package manifest...';indexPlain=await decryptV1(encryptedIndex,passwordKey)}else{status.textContent='Deriving package key...';const k0=performance.now();master=await deriveMaster(passwordKey,header.salt);kdfMs=performance.now()-k0;status.textContent=`Package key ready in ${kdfMs.toFixed(0)} ms.\nDecrypting manifest...`;indexPlain=await decryptV2(encryptedIndex,master,header.salt,'index.bp1')}let rawManifest;try{rawManifest=JSON.parse(dec.decode(indexPlain))}catch{throw new Error("Invalid manifest JSON or UTF-8.")}const manifest=validateManifest(rawManifest,header.version,header.salt),entries=Array.from(manifest.files.entries()),completed={n:0};status.textContent=`Decrypting ${entries.length} files...`;const results=await parallelMap(entries,header.version===V2?CONCURRENCY:Math.min(3,CONCURRENCY),async([path,info])=>{const encrypted=await downloadObject(repository,info.object);let plain;if(header.version===V1)plain=await decryptV1(encrypted,passwordKey);else plain=await decryptV2(encrypted,master,header.salt,info.object);await verify(path,plain,info);completed.n++;status.textContent=`Verified ${completed.n}/${entries.length}\n${path}`;return[path,{data:plain,type:info.type}]});const decrypted=new Map(results);status.textContent='Building verified virtual filesystem...';const id=packageId();newCache=CACHE_PREFIX+id;const meta=await putPackage(id,repository,manifest,decrypted,header.version);await deleteOldCaches(meta.cacheName);const total=performance.now()-started;status.textContent=`Launching ${meta.name}...\nLoaded in ${total.toFixed(0)} ms${header.version===V2?` · key derivation ${kdfMs.toFixed(0)} ms`:''}`;const site=$('website');site.src=new URL(`__bp1__/${id}/${encodePath(meta.entry)}`,document.baseURI).href;site.style.display='block';$('loader').style.display='none'}catch(e){console.error(e);if(newCache)await caches.delete(newCache).catch(()=>{});status.textContent=e?.message||'Invalid BP1 package.';button.disabled=false}}
$('loadButton').addEventListener('click',loadBP1);$('key').addEventListener('keydown',e=>{if(e.key==='Enter')loadBP1()});$('repository').addEventListener('keydown',e=>{if(e.key==='Enter')$('key').focus()});
</script></body></html>
